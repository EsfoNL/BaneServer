[package]
name = "bane-server"
default-run = "bane-server"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
ansi-to-html = "0.2.2"
argon2 = "0.4.1"
async-trait = "0.1.72"
axum = { version = "^0.8", features = ["macros", "tracing", "ws"] }
axum-extra = { version = "0.12.6", features = ["typed-header"] }
clap = { version = "4.0.32", features = ["derive"] }
console-subscriber = "0.4.0"
dashmap = "5.4.0"
either = "1.8.1"
futures = "0.3.30"
headers-core = "0.3.0"
http = "1.1.0"
nix = "0.29.0"
notify = "8.0.0"
rand = "0.10.2"
regex = "1.11.1"
serde = { version = "1.0.152", features = ["derive"] }
serde_json = "1.0.93"
sqlx = { version = ">=0.6", features = ["sqlite", "chrono", "runtime-tokio"] }
ssq = { version = "0.9", features = ["arma3", "async", "serde"]}
tera = { version = "2", features = ["glob_fs"] }
tera-contrib = { version = "0.3.0", features = ["date", "filesize_format"] }
thiserror = "1.0.57"
tokio = { version = "1.23.0", features = ["rt-multi-thread", "macros", "tracing", "process"] }
tokio-stream = "0.1.14"
tokio-util = "0.7.12"
toml = "0.8.9"
tower = "0.5.3"
tower-http = { version = "0.7.0", features = ["trace"] }
tracing = "0.1.37"
tracing-subscriber = "0.3.17"
uuid = { version = "1.7.0", features = ["v4", "serde"] }


[profile.release]
strip = true  # Automatically strip symbols from the binary.
lto = "fat"


